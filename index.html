<!-- MODAL XÁC NHẬN NẠP ẢNH: CHỌN ACC & RƯƠNG -->
  <div id="confirmUploadModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="scan-line" class="w-4 h-4 text-emerald-400"></i>
          <span>Xác Nhận Nạp Ảnh Rương</span>
        </h3>
        <button id="btnCancelUpload" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <!-- Preview ảnh vừa dán -->
      <div class="flex items-center gap-3 p-2 bg-slate-950 rounded-xl border border-slate-800">
        <img id="uploadPreviewImg" src="" class="w-16 h-16 object-cover rounded-lg border border-slate-700">
        <div class="text-xs text-slate-400">
          <span class="text-slate-200 font-semibold block">Ảnh lưới kho game</span>
          <span>Chọn đúng tài khoản và số rương để cập nhật.</span>
        </div>
      </div>

      <div class="space-y-3 text-xs">
        <!-- 1. Chọn hoặc nhập tên Tài khoản -->
        <div>
          <label class="text-slate-300 font-bold block mb-1">1. Tên Tài Khoản (Acc):</label>
          <div class="flex gap-2">
            <select id="selectAccount" class="flex-1 bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl text-emerald-300 focus:outline-none focus:border-emerald-500 font-semibold"></select>
            <button id="btnQuickNewAcc" title="Thêm tên tài khoản mới" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 font-semibold">
              <i data-lucide="user-plus" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- 2. Chọn Rương (1, 2, 3...) -->
        <div>
          <label class="text-slate-300 font-bold block mb-1">2. Chọn Rương Cần Nạp:</label>
          <div class="grid grid-cols-4 gap-2" id="chestNumberSelector">
            <button type="button" class="btn-chest-num py-2 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 font-bold hover:border-emerald-500 active-chest" data-num="Rương 1">Rương 1</button>
            <button type="button" class="btn-chest-num py-2 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 font-bold hover:border-emerald-500" data-num="Rương 2">Rương 2</button>
            <button type="button" class="btn-chest-num py-2 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 font-bold hover:border-emerald-500" data-num="Rương 3">Rương 3</button>
            <button type="button" id="btnCustomChestNum" class="py-2 rounded-xl border border-dashed border-slate-600 bg-slate-950 text-slate-400 hover:text-white font-semibold">+ Khác</button>
          </div>
          <input type="text" id="customChestInput" placeholder="Nhập tên rương khác..." class="hidden mt-2 w-full px-3 py-1.5 bg-slate-950 border border-slate-700 rounded-xl text-slate-200 focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <!-- Nút hành động -->
      <div class="pt-3 border-t border-slate-800 flex justify-end gap-2">
        <button id="btnDismissUpload" class="px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 rounded-xl font-medium">Hủy</button>
        <button id="btnConfirmUpload" class="px-4 py-2 text-xs bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold flex items-center gap-1.5 shadow-lg shadow-emerald-900/30">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Cập Nhật Rương</span>
        </button>
      </div>
    </div>
  </div>
